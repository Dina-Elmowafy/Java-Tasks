name: Unpack E-Wallet project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project and remove archive
        shell: bash
        run: |
          if [ ! -f src/e-wallet-hibernate-submission.zip ]; then
            echo "Archive already removed; nothing to do."
            exit 0
          fi
          mkdir -p src/EWalletServletHibernate
          unzip -o src/e-wallet-hibernate-submission.zip -d src/EWalletServletHibernate || true
          git rm src/e-wallet-hibernate-submission.zip
          git add -f src/EWalletServletHibernate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unpack E-Wallet project source"
          git push
