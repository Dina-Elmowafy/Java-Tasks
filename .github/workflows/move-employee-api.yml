name: Move Employee API to Spring Tasks

on:
  push:
    paths:
      - '.github/workflows/move-employee-api.yml'

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Employee API
        shell: bash
        run: |
          source="src/EmployeeApi"
          destination="src/Spring Tasks/EmployeeApi"

          if [ ! -d "$source" ]; then
            echo "EmployeeApi is already moved."
            exit 0
          fi

          if [ -e "$destination" ]; then
            echo "Destination already exists."
            exit 1
          fi

          mkdir -p "src/Spring Tasks"
          git mv "$source" "$destination"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move Employee API into Spring Tasks"
          git push
