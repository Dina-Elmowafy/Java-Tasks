name: Unpack database Task 5

on:
  push:
    paths:
      - 'src/DB TASKS/task5-upload.zip'
      - '.github/workflows/unpack-task5.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Task 5
        shell: bash
        run: |
          archive="src/DB TASKS/task5-upload.zip"
          destination="src/DB TASKS/Task 5"

          if [ ! -f "$archive" ]; then
            echo "Archive is already removed."
            exit 0
          fi

          if [ -e "$destination" ]; then
            echo "Destination already exists: $destination"
            exit 1
          fi

          mkdir -p "$destination"
          unzip -q "$archive" -d "$destination"
          git rm "$archive"
          git add -f "$destination"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add database lecture 5 tasks"
          git push
