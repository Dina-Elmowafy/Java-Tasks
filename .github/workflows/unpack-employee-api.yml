name: Unpack Employee Oracle API
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        shell: bash
        run: |
          if [ ! -f src/employee-api-oracle-upload.zip ]; then exit 0; fi
          mkdir -p src/EmployeeApiOracle
          unzip -o src/employee-api-oracle-upload.zip -d src/EmployeeApiOracle
          git rm src/employee-api-oracle-upload.zip
          git add -f src/EmployeeApiOracle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Employee Oracle REST API project"
          git push
