spring.application.name=employee-api-oracle
server.port=8080

# Oracle XE 18c/21c usually uses the XEPDB1 service.
# Change username, password, host, port or service to match your Oracle setup.
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=employee_user
spring.datasource.password=employee_password
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Makes validation errors easier to read while learning.
server.error.include-message=always
